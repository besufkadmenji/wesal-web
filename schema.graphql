type Mutation {
  """Provider accepts a pending contract"""
  acceptContract(input: AcceptContractInput!): Contract!
  activateAdmin(id: ID!): Admin!
  activateBank(id: ID!): Bank!
  activateCategory(id: ID!): Category!
  activateCity(id: ID!): City!
  activateDeliveryCompany(id: ID!): DeliveryCompany!
  activateListing(id: ID!): Listing!

  """Activate provider by ID"""
  activateProvider(id: ID!): Provider!

  """Activate user by ID"""
  activateUser(id: ID!): User!
  addComplaintMessage(complaintId: String!, content: String!): ComplaintMessage!
  adminChangePassword(input: AdminChangePasswordInput!): Boolean!
  adminForgotPassword(input: AdminForgotPasswordInput!): Boolean!
  adminLogin(input: AdminLoginInput!): AdminAuthResponse!

  """Admin reactivates a provider whose contract was terminated by admin"""
  adminReactivateProvider(providerId: ID!): Provider!
  adminReplyToComplaint(complaintId: String!, content: String!): ComplaintMessage!
  adminResetPassword(input: AdminResetPasswordInput!): Boolean!
  adminSetComplaintStatus(complaintId: String!, status: ComplaintStatus!): Complaint!

  """Admin terminates provider contract"""
  adminTerminateProviderContract(input: AdminTerminateContractInput!): Provider!
  adminVerifyPasswordResetOtp(input: VerifyAdminPasswordResetOtpInput!): VerifyAdminPasswordResetOtpResponse!
  assignPermissionToAdmin(input: AssignPermissionInput!): AdminPermission!
  bulkAssignPermissionsToAdmin(input: BulkAssignPermissionsInput!): [AdminPermission!]!
  bulkRevokePermissionsFromAdmin(adminId: ID!, permissionIds: [ID!]!): Boolean!

  """Bulk update FAQ order (admin only)"""
  bulkUpdateOrder(input: BulkUpdateFaqOrderInput!): [Faq!]!

  """Change password for authenticated user"""
  changePassword(input: ChangePasswordInput!): Boolean!

  """Change password for authenticated provider"""
  changeProviderPassword(input: ChangePasswordInput!): Boolean!

  """Customer signs and completes an in-progress contract"""
  completeContract(input: CompleteContractInput!): Contract!
  createAdmin(createAdminInput: CreateAdminInput!): Admin!
  createBank(input: CreateBankInput!): Bank!
  createCategory(input: CreateCategoryInput!): Category!
